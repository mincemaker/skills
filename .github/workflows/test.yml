name: Test skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  oauth-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Check skill packaging and source scripts
        run: node --test oauth-audit/scripts/*.test.mjs
      - name: Test Go tools
        run: go -C oauth-audit/tools test ./...
